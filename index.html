<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
  body { background: #111; color: #fff; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; touch-action: none; }
  h2 { margin: 5px 0; font-size: 18px; }
  canvas { background: #000; display: block; margin: 5px auto; border: 2px solid #333; max-width: 100%; height: auto; }
  .controls { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
  .btn { background: #333; color: #fff; border: 2px solid #555; font-size: 22px; padding: 15px 30px; border-radius: 8px; user-select: none; -webkit-user-select: none; outline: none; cursor: pointer; }
  .btn:active { background: #555; }
</style>
</head>
<body>
<h2>Space Shooter</h2>
<canvas id="gameCanvas" width="400" height="480"></canvas>
<div class="controls">
  <button class="btn" id="leftBtn">&#9664;</button>
  <button class="btn" id="shootBtn">&#9673;</button>
  <button class="btn" id="rightBtn">&#9654;</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = { x: 180, y: 420, w: 40, h: 25, speed: 6 };
let bullets = [];
let enemies = [];
let score = 0;
let gameOver = false;
let keys = {};

window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code === 'Space' && gameOver) resetGame(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function setupButton(id, code) {
  const el = document.getElementById(id);
  const press = (e) => { e.preventDefault(); keys[code] = true; if(gameOver && code === 'Space') resetGame(); };
  const release = (e) => { e.preventDefault(); keys[code] = false; };
  
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
  el.addEventListener('touchstart', press);
  el.addEventListener('touchend', release);
}

setupButton('leftBtn', 'ArrowLeft');
setupButton('rightBtn', 'ArrowRight');
setupButton('shootBtn', 'Space');

function resetGame() {
  player.x = 180;
  bullets = [];
  enemies = [];
  score = 0;
  gameOver = false;
}

let spawnTimer = 0;
function update() {
  if (gameOver) return;

  if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
  if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.w) player.x += player.speed;

  if (keys['Space'] && !player.cooldown) {
    bullets.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 10, speed: 8 });
    player.cooldown = true;
    setTimeout(() => player.cooldown = false, 200);
  }

  bullets.forEach(b => b.y -= b.speed);
  bullets = bullets.filter(b => b.y > 0);

  spawnTimer++;
  if (spawnTimer > 40) {
    enemies.push({ x: Math.random() * (canvas.width - 30), y: -30, w: 30, h: 30, speed: 2 + Math.random() * 2 });
    spawnTimer = 0;
  }

  enemies.forEach(e => e.y += e.speed);

  bullets.forEach((b, bi) => {
    enemies.forEach((e, ei) => {
      if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
        bullets.splice(bi, 1);
        enemies.splice(ei, 1);
        score += 10;
      }
    });
  });

  enemies.forEach((e, ei) => {
    if (e.y > canvas.height) enemies.splice(ei, 1);
    if (e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
      gameOver = true;
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0ff';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = '#ff0';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  ctx.fillStyle = '#f00';
  enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));

  ctx.fillStyle = '#fff';
  ctx.font = '16px sans-serif';
  ctx.fillText('Score: ' + score, 10, 25);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 10);
    ctx.font = '14px sans-serif';
    ctx.fillText('Tap Shoot to restart', canvas.width/2, canvas.height/2 + 20);
    ctx.textAlign = 'left';
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
